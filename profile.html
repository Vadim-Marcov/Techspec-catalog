<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TechSpec Catalog - Профиль</title>
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>

  <header class="header">
    <div class="header-container">
      <div class="logo">
        <span class="logo-badge">TS</span>
        <span>TechSpec Catalog</span>
      </div>
      <nav class="nav">
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Главная</a></li>
          <li><a href="cart.html" class="nav-link">Корзина</a></li>

      </nav>

  </header>

  <main class="container">
    <h1 class="page-title">Рабочее пространство</h1>

    <div class="profile-wrapper">
      <section class="profile-card">
        <div class="profile-avatar">SJ</div>
        <div class="profile-info">
          <h2 class="profile-name">Sarah Jenkins</h2>
          <p class="profile-email">sarahj00@gmail.com</p>
        </div>

      <section class="profile-actions">
        <button class="btn-secondary">Редактировать</button>
        <button class="btn-danger">Выйти из аккаунта</button>
      </section>

      <section class="profile-history">
        <h2 class="section-subtitle">Последние заказы</h2>
        <div class="order-item">
          <div>
            <div class="order-id">Заказ #TS-8042</div>
            <div class="order-date">12 сентября 2026</div>
          </div>
          <span class="order-status">Доставлен</span>

    </div>

  <footer class="footer">
    <p>© 2026 TechSpec Catalog</p>
